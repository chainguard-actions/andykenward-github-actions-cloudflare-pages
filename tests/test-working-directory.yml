name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory and static files
        run: |
          mkdir -p /tmp/workdir/dist
          echo "<html><body>Test</body></html>" > /tmp/workdir/dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: dist
          github-token: ${{ github.token }}
          github-environment: preview
          working-directory: /tmp/workdir
          wrangler-version: '3.78.0'

      - name: Assert action ran (failed due to invalid credentials, not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid Cloudflare credentials,
          # not due to missing or invalid working-directory/wrangler-version inputs.
          # We just need to confirm the action was invoked (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with working-directory and wrangler-version inputs"
