name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create static files directory and working directory
        run: |
          mkdir -p /tmp/test-workdir/dist
          echo "<html><body>Test</body></html>" > /tmp/test-workdir/dist/index.html

      - name: Run action with working-directory input (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: dist
          github-token: ${{ github.token }}
          github-environment: preview
          working-directory: /tmp/test-workdir

      - name: Assert action failed due to invalid credentials (not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials (working-directory input was accepted)"
