name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and static files
        run: |
          mkdir -p /tmp/workdir
          mkdir -p /tmp/workdir/dist
          echo "<html><body>Hello</body></html>" > /tmp/workdir/dist/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: dist
          github-token: ${{ github.token }}
          github-environment: preview
          working-directory: /tmp/workdir
          wrangler-version: '3.99.0'
      - name: Assert action ran with working-directory and wrangler-version inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid Cloudflare credentials,
          # but it must have been invoked (not skipped). A skipped step would
          # have outcome 'skipped', not 'failure' or 'success'.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs were not processed"
            exit 1
          fi
          echo "PASS: action ran with working-directory and wrangler-version inputs"
