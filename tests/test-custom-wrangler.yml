name: Test custom wrangler version (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy static directory and working directory
        run: |
          mkdir -p /tmp/static-wrangler
          echo "<h1>Wrangler Test</h1>" > /tmp/static-wrangler/index.html
          mkdir -p /tmp/workdir

      - name: Run action with custom wrangler version (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token-for-testing
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: /tmp/static-wrangler
          github-token: fake-github-token
          github-environment: production
          wrangler-version: "3.99.0"
          working-directory: /tmp/workdir
          branch: main

      - name: Assert action failed (invalid credentials should cause failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials using custom wrangler version"
