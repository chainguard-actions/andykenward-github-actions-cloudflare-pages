name: Test workflow_dispatch event with mock credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake dist directory
        run: mkdir -p dist && echo "hello" > dist/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: dist
          github-token: fake-github-token
          github-environment: production
      - name: Assert action failed at API stage (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake credentials (expected for workflow_dispatch event)"
