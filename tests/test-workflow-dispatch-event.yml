name: Test workflow_dispatch event is supported
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create static directory for upload
        run: |
          mkdir -p /tmp/test-static-dispatch
          echo "<html><body>Dispatch Test</body></html>" > /tmp/test-static-dispatch/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "fake-invalid-token-for-testing"
          cloudflare-account-id: "fake-account-id-00000000000000000000"
          cloudflare-project-name: "fake-test-project"
          directory: "/tmp/test-static-dispatch"
          github-token: ${{ github.token }}
          github-environment: "production"

      - name: Assert action attempted deployment (not rejected due to event type)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action supports workflow_dispatch, so it should NOT fail with
          # "GitHub Action event name 'workflow_dispatch' not supported."
          # It should fail at the Cloudflare API call (invalid credentials),
          # meaning outcome is 'failure' (not 'skipped' or 'success').
          # If it were an unsupported event, it would also fail, but with a different message.
          # We verify the action ran and failed (as expected with fake credentials).
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          fi
          echo "PASS: action ran and failed as expected (workflow_dispatch event is supported, credentials were invalid)"
