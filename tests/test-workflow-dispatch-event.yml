name: Test workflow_dispatch event is supported
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create static directory for upload
        run: |
          mkdir -p /tmp/test-static-dispatch
          echo '<html><body>Dispatch Test</body></html>' > /tmp/test-static-dispatch/index.html

      - id: deploy
        name: Run deploy action under workflow_dispatch event
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: invalid-token-for-testing
          cloudflare-account-id: 0000000000000000000000000000000a
          cloudflare-project-name: test-project-dispatch
          directory: /tmp/test-static-dispatch
          github-token: ${{ github.token }}
          github-environment: preview

      - name: Assert action failed at Cloudflare API (not at event check)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.wrangler }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wrangler output: $WRANGLER_OUTPUT"
          # The action should fail (due to invalid Cloudflare credentials),
          # NOT succeed (which would require real credentials).
          # If it failed, it means it got past the event-name check (workflow_dispatch is supported)
          # and attempted the Cloudflare API call.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed workflow_dispatch event and failed at Cloudflare API"
