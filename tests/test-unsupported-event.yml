name: Test unsupported event name fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: schedule
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: .
          github-token: fake-github-token
          github-environment: production
        env:
          GITHUB_EVENT_NAME: schedule

      - name: Assert action failed with unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event name"
