name: Test basic usage with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake static directory to upload
        run: |
          mkdir -p /tmp/test-dist
          echo "<html><body>Hello World</body></html>" > /tmp/test-dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: /tmp/test-dist
          github-token: ${{ github.token }}
          github-environment: production

      - name: Assert action ran and failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid Cloudflare credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (real credentials may be in use)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
