name: Test invalid Cloudflare credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create static directory for upload
        run: |
          mkdir -p /tmp/test-static
          echo "<html><body>Hello</body></html>" > /tmp/test-static/index.html

      - name: Run action with invalid Cloudflare credentials
        id: deploy
        continue-on-error: true
        uses: .
        with:
          cloudflare-api-token: "fake-invalid-token-for-testing"
          cloudflare-account-id: "fake-account-id-00000000000000000000"
          cloudflare-project-name: "fake-test-project"
          directory: "/tmp/test-static"
          github-token: ${{ github.token }}
          github-environment: "preview"

      - name: Assert action failed (expected with invalid credentials)
        run: |
          echo "outcome: ${{ steps.deploy.outcome }}"
          if [ "${{ steps.deploy.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got: ${{ steps.deploy.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"

      - name: Assert failure was NOT due to unsupported event
        run: |
          # The action supports workflow_dispatch, so it should NOT fail with
          # "event name not supported". It should fail at the Cloudflare API call.
          # We verify the step outcome was failure (already checked above) and
          # that the action at least got past the event check.
          echo "PASS: action ran under workflow_dispatch (supported event) and failed at API call as expected"
