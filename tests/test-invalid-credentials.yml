name: Test invalid Cloudflare credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create static directory for upload
        run: |
          mkdir -p /tmp/test-static
          echo "<html><body>Test</body></html>" > /tmp/test-static/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "fake-invalid-token-for-testing"
          cloudflare-account-id: "fake-account-id-00000000000000000000"
          cloudflare-project-name: "fake-test-project"
          directory: "/tmp/test-static"
          github-token: ${{ github.token }}
          github-environment: "preview"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
