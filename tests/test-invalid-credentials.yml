name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy static directory
        run: |
          mkdir -p /tmp/test-static
          echo "<html><body>Hello</body></html>" > /tmp/test-static/index.html

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "invalid-token-for-testing"
          cloudflare-account-id: "invalid-account-id"
          cloudflare-project-name: "test-project"
          directory: "/tmp/test-static"
          github-token: ${{ github.token }}
          github-environment: "preview"

      - name: Assert action failed (not a crash)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
