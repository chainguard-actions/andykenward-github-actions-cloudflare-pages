name: Test branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy build directory
        run: mkdir -p /tmp/dist && echo "<html>branch test</html>" > /tmp/dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-token-for-testing
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: /tmp/dist
          github-token: ${{ github.token }}
          github-environment: preview
          branch: main

      - name: Assert action ran and failed gracefully (no real Cloudflare credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials present?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Cloudflare credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
