name: Test with branch and wrangler options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal static directory to upload
        run: |
          mkdir -p /tmp/dist-branch
          echo "<html><body>Branch Test</body></html>" > /tmp/dist-branch/index.html
          echo "body { color: red; }" > /tmp/dist-branch/style.css

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "fake-cf-token-for-testing"
          cloudflare-account-id: "fake-account-id"
          cloudflare-project-name: "fake-project"
          directory: "/tmp/dist-branch"
          github-token: ${{ github.token }}
          github-environment: "preview"
          branch: "main"
          wrangler-comment-output: "false"

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          ENV_OUT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "environment: $ENV_OUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid Cloudflare credentials / sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with url='$URL' environment='$ENV_OUT'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
