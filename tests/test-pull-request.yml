name: Test pull request deploy (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy static directory
        run: mkdir -p /tmp/static-pr && echo "<h1>PR Preview</h1>" > /tmp/static-pr/index.html

      - name: Run action for pull request (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-api-token-for-testing
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: /tmp/static-pr
          github-token: fake-github-token
          github-environment: preview
          pr-number: "42"
          branch: feature-branch

      - name: Assert action failed (invalid credentials should cause failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials on PR event"
