name: Test missing directory error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "fake-invalid-token-for-testing"
          cloudflare-account-id: "fake-account-id-00000000000000000000"
          cloudflare-project-name: "fake-test-project"
          directory: "/tmp/nonexistent-directory-that-does-not-exist"
          github-token: ${{ github.token }}
          github-environment: "preview"

      - name: Assert action failed with missing directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing directory, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing directory"
