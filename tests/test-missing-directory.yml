name: Test missing directory error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent directory (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "invalid-token-for-testing"
          cloudflare-account-id: "invalid-account-id"
          cloudflare-project-name: "test-project"
          directory: "/tmp/this-directory-does-not-exist-at-all"
          github-token: ${{ github.token }}
          github-environment: "preview"

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with missing directory, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with missing directory"
