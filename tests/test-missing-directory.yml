name: Test missing directory error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        name: Run deploy action with non-existent directory
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: invalid-token-for-testing
          cloudflare-account-id: 0000000000000000000000000000000a
          cloudflare-project-name: test-project
          directory: /tmp/this-directory-does-not-exist
          github-token: ${{ github.token }}
          github-environment: preview

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-existent directory, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with non-existent directory"
