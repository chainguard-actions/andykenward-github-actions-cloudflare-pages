name: Test with explicit PR number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal static directory to upload
        run: |
          mkdir -p /tmp/dist-pr
          echo "<html><body>PR Preview</body></html>" > /tmp/dist-pr/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: "fake-cf-token-for-testing"
          cloudflare-account-id: "fake-account-id"
          cloudflare-project-name: "fake-project"
          directory: "/tmp/dist-pr"
          github-token: ${{ github.token }}
          github-environment: "preview"
          pr-number: "1"
          wrangler-comment-output: "true"

      - name: Assert action ran and failed gracefully with PR number set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid Cloudflare credentials / sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with url='$URL' id='$ID'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
