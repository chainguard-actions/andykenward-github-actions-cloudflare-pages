name: Test wrangler-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cloudflare-api-token: fake-cf-token
          cloudflare-account-id: fake-account-id
          cloudflare-project-name: fake-project
          directory: dist
          github-token: ${{ github.token }}
          github-environment: preview
          wrangler-version: '3.78.0'
      - name: Assert action ran (failed gracefully with sentinel repo or missing CF credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials present)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo / fake CF credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
